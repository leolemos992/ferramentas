<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Senha Diária</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
        <h1 class="text-2xl font-bold text-center mb-4">Gerador de Senha Diária</h1>
        <p class="text-gray-600 text-center mb-6">Clique no botão abaixo para gerar a senha de hoje.</p>
        
        <button id="generate-btn" class="w-full bg-blue-500 text-white font-bold py-2 px-4 rounded hover:bg-blue-600 transition-colors">
            Gerar Senha para Hoje
        </button>

        <div id="result-container" class="mt-6 p-4 bg-gray-50 border border-gray-200 rounded-lg text-center hidden">
            <p class="text-gray-700">A senha para o dia <strong id="current-date"></strong> é:</p>
            <p id="password-output" class="text-2xl font-mono font-bold text-blue-700 mt-2 break-all"></p>
            <button id="copy-btn" class="mt-4 bg-gray-200 text-gray-800 text-sm py-1 px-3 rounded hover:bg-gray-300">Copiar</button>
        </div>
        <p id="copy-feedback" class="text-center text-green-600 text-sm mt-2 h-4"></p>
    </div>

    <script>
        const generateBtn = document.getElementById('generate-btn');
        const resultContainer = document.getElementById('result-container');
        const currentDateEl = document.getElementById('current-date');
        const passwordOutput = document.getElementById('password-output');
        const copyBtn = document.getElementById('copy-btn');
        const copyFeedback = document.getElementById('copy-feedback');

        async function generatePassword() {
            const date = new Date();
            const day = date.getDate();
            const month = date.getMonth() + 1;
            const year = date.getFullYear() % 100;
            
            const secretSeed = (day * month * year * 3).toString();

            const encoder = new TextEncoder();
            const data = encoder.encode(secretSeed);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            
            return hashHex.slice(0, 8);
        }

        generateBtn.addEventListener('click', async () => {
            const password = await generatePassword();
            const today = new Date();
            currentDateEl.textContent = today.toLocaleDateString('pt-BR');
            passwordOutput.textContent = password;
            resultContainer.classList.remove('hidden');
        });

        copyBtn.addEventListener('click', () => {
            navigator.clipboard.writeText(passwordOutput.textContent).then(() => {
                copyFeedback.textContent = 'Senha copiada!';
                setTimeout(() => {
                    copyFeedback.textContent = '';
                }, 2000);
            });
        });
    </script>
</body>
</html>
