<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Senha Diária</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
        <h1 class="text-2xl font-bold mb-4 text-center">Gerador de Senha Diária</h1>
        <p class="text-gray-600 mb-6 text-center">Use esta ferramenta para gerar a senha de acesso para o dia atual.</p>
        
        <div class="space-y-4">
            <div>
                <label for="secretSeed" class="block text-sm font-medium text-gray-700">Seu Segredo (Secret Seed)</label>
                <input type="password" id="secretSeed" class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" placeholder="Cole seu NEXT_PUBLIC_COMPARATOR_SECRET_SEED aqui">
            </div>
            
            <button id="generateButton" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                Gerar Senha
            </button>
        </div>

        <div id="result" class="mt-6 p-4 bg-gray-50 rounded-md border border-gray-200 hidden">
            <h2 class="text-lg font-semibold">Senha do Dia:</h2>
            <p id="passwordDisplay" class="mt-2 text-2xl font-mono text-indigo-700 bg-indigo-50 p-3 rounded-md text-center break-all"></p>
            <p class="text-xs text-gray-500 mt-2">Esta senha é válida apenas para hoje.</p>
        </div>
    </div>

    <script>
        async function generateDailyPassword(seed) {
            const date = new Date();
            const dateString = `${date.getFullYear()}-${(date.getMonth() + 1).toString().padStart(2, '0')}-${date.getDate().toString().padStart(2, '0')}`;
            const dataToHash = seed + dateString;

            const encoder = new TextEncoder();
            const data = encoder.encode(dataToHash);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            
            return hashHex.substring(0, 8);
        }

        document.getElementById('generateButton').addEventListener('click', async () => {
            const seed = document.getElementById('secretSeed').value;
            if (!seed) {
                alert('Por favor, insira o seu segredo.');
                return;
            }

            const password = await generateDailyPassword(seed);
            
            document.getElementById('passwordDisplay').textContent = password;
            document.getElementById('result').classList.remove('hidden');
        });
    </script>
</body>
</html>
